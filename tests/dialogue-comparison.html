<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>對話比例：原版與草稿比較</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee9e1;color:#302820;font:16px/1.6 system-ui}main{max-width:1500px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 6px}p{margin:0 0 18px;color:#675b50}nav{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}label{display:flex;gap:8px;align-items:center}select{font:inherit;padding:8px;border:1px solid #bcae9f;border-radius:6px;background:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}h2{font-size:18px;margin:0 0 10px}a{color:#82452f}.stage{position:relative;width:100%;overflow:hidden;background:#151515;border-radius:8px}iframe{border:0;position:absolute;left:0;top:0;transform-origin:top left}small{display:block;margin:10px 0;color:#675b50}@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style>
<main><h1>對話比例比較</h1><p>同一段台詞、同一個角色。左邊是原版，右邊是比例調整草稿。</p>
<nav>
<label for="device">裝置<select id="device"><option value="1280,720">桌機 1280 × 720</option><option value="844,390">手機橫向 844 × 390</option><option value="1024,768">平板 1024 × 768</option></select></label>
<label for="sample">畫面<select id="sample"><option value="short">一般台詞</option><option value="long">較長台詞</option><option value="quiz">四個問答選項</option></select></label>
<label for="mode">模式<select id="mode"><option value="0">青年版</option><option value="1">小朋友版</option></select></label>
<label for="actor">角色<select id="actor"><option value="阿斗仔">阿斗仔</option><option value="mom">媽媽</option><option value="herbal_owner">中藥行老闆</option><option value="knife_smith">刀行師傅</option></select></label>
</nav>
<div class="grid"><section><h2>原版 <a id="beforeLink" target="_blank" rel="noopener">放大查看 ↗</a></h2><div class="stage"><iframe id="before" title="原版對話畫面"></iframe></div><small>保留原本的對話框、文字與角色比例。</small></section>
<section><h2>草稿 <a id="afterLink" target="_blank" rel="noopener">放大查看 ↗</a></h2><div class="stage"><iframe id="after" title="草稿對話畫面"></iframe></div><small>加大文字與行距、調整閱讀區，角色上移。仍維持 16:9。</small></section></div>
<p id="status" role="status">載入比較畫面…</p></main>
<script>
const $=id=>document.getElementById(id);
function size(){const [width,height]=$('device').value.split(',').map(Number);document.querySelectorAll('.stage').forEach(stage=>{const scale=stage.clientWidth/width;stage.style.height=(height*scale)+'px';stage.querySelector('iframe').style.cssText='width:'+width+'px;height:'+height+'px;transform:scale('+scale+')'})}
function render(){const sample=$('sample').value;for(const layout of ['before','after']){const q=new URLSearchParams({testScene:sample==='quiz'?'quiz':'dialogue',sample,child:$('mode').value,actor:$('actor').value,layout,safe:$('device').value==='844,390'?'1':'0'});const url='/GAME/?'+q;$(layout).src=url;$(layout+'Link').href=url}size();$('status').textContent='可切換裝置、長台詞、角色與模式比較；放大查看可直接操作。'}
document.querySelectorAll('select').forEach(s=>s.addEventListener('change',render));window.addEventListener('resize',size);render();
</script></html>
