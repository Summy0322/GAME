.wind-lower-right { right:2%;bottom:23%;transform:scaleX(-1); }
.defense-wind-leaf {
    position:absolute;left:-24px;top:50%;width:clamp(14px,5.2cqh,26px);height:clamp(8px,2.8cqh,14px);
    border-radius:85% 0 85% 0;background:linear-gradient(135deg,#b6a47b,#80745e);border:1px solid #c6bb9633;
    opacity:0;will-change:transform;animation:defense-night-leaf 1800ms cubic-bezier(.25,.45,.55,.8) both;
}
.defense-wind-leaf::after { content:"";position:absolute;left:15%;right:12%;top:48%;height:1px;background:#f2dfaf55;transform:rotate(-28deg); }
.wind-lower-right .defense-wind-leaf { animation-delay:180ms;background:linear-gradient(135deg,#a1ad8c,#68786e); }
@keyframes defense-night-leaf {
    0% { transform:translate3d(0,1cqh,0) rotate(-35deg);opacity:0; }
    15% { opacity:.58; }
    50% { transform:translate3d(13cqw,-1cqh,0) rotate(30deg);opacity:.58; }
    85% { opacity:.45; }
    100% { transform:translate3d(28cqw,-4cqh,0) rotate(105deg);opacity:0; }
}
@media (prefers-reduced-motion:reduce) { .defense-night-wind { display:none; } }

/* 中央單行提示帶：全寬、半透明，兩側漸隱；只在預告期間淡入淡出。 */
.memory-swap-notice { position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:30;box-sizing:border-box;width:100%;padding:clamp(14px,4cqh,30px) 12px;text-align:center;pointer-events:none;background:linear-gradient(90deg,#172b4700,#172b47b8 18%,#243b59cc 50%,#172b47b8 82%,#172b4700);animation:memory-swap-banner 1100ms ease-in-out both; }
.memory-swap-notice[hidden] { display:none; }
.memory-swap-notice strong { display:block;color:#ffe3ac;font-size:clamp(24px,6.5cqh,46px);line-height:1.3;letter-spacing:.12em;white-space:nowrap;text-shadow:0 2px 8px #071427aa; }
@keyframes memory-swap-banner { 0%,100% { opacity:0; } 18%,76% { opacity:1; } }
@media (prefers-reduced-motion:reduce) { .memory-swap-notice { animation:none; } }
/* 特殊波的提示只占預備時間；作答時保留角色與四向目標的視線。 */
.defense-special-notice { position:absolute;left:0;top:50%;transform:translateY(-50%);width:100%;box-sizing:border-box;padding:14px 12px;z-index:90;text-align:center;pointer-events:none;color:#ffe2ad;background:linear-gradient(90deg,#18364c00,#18364cdb 18%,#18364cdb 82%,#18364c00);font-size:clamp(17px,4.5cqh,30px);line-height:1.4; }
.defense-special-cue { position:absolute;left:3%;bottom:20%;max-width:26%;box-sizing:border-box;padding:5px 12px;border:1px solid #e5c18d77;border-radius:9px 3px;background:#16364bd9;color:#ffe2ad;font-size:clamp(11px,2.7cqh,18px);text-align:center;pointer-events:none;z-index:65; }
.defense-order-badge { position:absolute;right:-7px;top:-7px;display:grid;place-items:center;width:clamp(21px,5cqh,32px);height:clamp(21px,5cqh,32px);border:2px solid #ffdda0;border-radius:50%;background:#19364cf2;color:#ffe4b4;font:bold clamp(13px,3.5cqh,22px)/1 sans-serif;box-shadow:0 2px 5px #07172966;pointer-events:none; }
.defense-order-badge.is-top-target { top:auto;bottom:-5px; }
.defense-order-badge[hidden] { display:none; }
