<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>操作練習 UI 預覽</title><style>
*{box-sizing:border-box}body{margin:0;background:#102334;color:#e6eff2;font-family:system-ui,'Microsoft JhengHei',sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(92vw,960px);padding:24px}button{font:inherit;color:inherit;cursor:pointer}nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}nav button{border:1px solid #7797a955;background:transparent;padding:8px 18px;border-radius:30px;font-size:13px}.eyebrow{font-size:12px;letter-spacing:.2em;color:#9ebbc9}h1{font-size:30px;margin:6px 0}header p{color:#b2c5ce;font-size:14px;margin:8px 0 24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid #93b3bd40;border-radius:16px;background:#28445380;text-align:left;padding:20px 16px;min-height:168px;transition:.2s}.card:hover,.card[aria-pressed=true]{border-color:#d8bd86;background:#38545b;transform:translateY(-3px)}.icon{font-size:30px;color:#d8bd86;display:block;height:48px}.card strong{display:block;font-size:18px;margin:12px 0 8px}.card small{color:#b3c8d0;font-size:12px;line-height:1.7}.detail{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:20px 0;border-bottom:1px solid #8eacb533}.detail p{margin:6px 0;color:#b3c8d0;font-size:13px}.action{border:0;border-radius:30px;background:#cfb57f;color:#20313b;padding:12px 28px;white-space:nowrap;font-weight:bold}footer{font-size:12px;color:#99b2bd;margin-top:16px}.catalog{display:none}.catalog .grid{grid-template-columns:1fr 1fr}.practice-link{width:100%;margin-top:16px;border:1px solid #b6c6be44;background:#28464b;padding:16px 20px;border-radius:14px;display:flex;justify-content:space-between;text-align:left}.practice-link small{display:block;color:#abc1c7;margin-top:5px}.notice{min-height:18px;color:#dfc796;font-size:13px}@media(max-width:650px){main{padding:12px}.grid{grid-template-columns:1fr 1fr}.card{min-height:120px;padding:12px}.icon{font-size:23px;height:26px}nav{margin-bottom:12px}header p{margin-bottom:14px}h1{font-size:24px}.detail{padding:12px 0}.card strong{font-size:16px;margin:8px 0}.detail p{max-width:250px}}</style>
<main><nav><button onclick="view('catalog')">← 挑戰目錄</button><span class="eyebrow">UI 設計預覽</span></nav><section id="practice"><header><span class="eyebrow">先熟悉，再挑戰</span><h1>操作練習</h1><p>挑一種想熟悉的操作，依自己的步調反覆練習。</p></header><div class="grid">
<button class="card" aria-pressed="true" onclick="pick(this,'重擊格擋','等目標全亮，再滑動格擋。')"><span class="icon">▥</span><strong>重擊格擋</strong><small>掌握全亮後的出手時機</small></button><button class="card" aria-pressed="false" onclick="pick(this,'旋轉防守','繞著角色畫圈，練習維持回推節奏。')"><span class="icon">↻</span><strong>旋轉防守</strong><small>找到與波紋拉鋸的節奏</small></button><button class="card" aria-pressed="false" onclick="pick(this,'順序滑動','照編號連續滑動，數字會一直保留。')"><span class="icon">① → ②</span><strong>順序滑動</strong><small>照編號，連續接住目標</small></button><button class="card" aria-pressed="false" onclick="pick(this,'記憶順序','記住編號；隨時可滑動開始，第一下後數字隱藏。')"><span class="icon">① · ·</span><strong>記憶順序</strong><small>記住位置，再依序滑動</small></button></div><div class="detail"><div><strong id="selection">重擊格擋</strong><p id="description">等目標全亮，再滑動格擋。</p></div><button class="action" onclick="document.querySelector('.notice').textContent='目前為 UI 預覽；此按鈕尚未接入練習關卡。'">開始練習 →</button></div><footer>不計分・不扣生命・可隨時離開</footer><p class="notice" role="status"></p></section>
<section id="catalog" class="catalog"><header><span class="eyebrow">夜間挑戰</span><h1>挑戰自己，再進步一點</h1><p>選擇限時或無限模式，留下你的最佳紀錄。</p></header><div class="grid"><div class="card"><span class="icon">◇</span><strong>防守挑戰</strong><small>限時挑戰　／　無限模式</small></div><div class="card"><span class="icon">▧</span><strong>記憶挑戰</strong><small>限時挑戰　／　無限模式</small></div></div><button class="practice-link" onclick="view('practice')"><span>操作練習<small>想先熟悉手感？從一種操作開始。</small></span><span>前往練習 →</span></button></section></main>
<script>function view(id){document.getElementById('practice').style.display=id==='practice'?'block':'none';document.getElementById('catalog').style.display=id==='catalog'?'block':'none'}function pick(button,title,description){document.querySelectorAll('.card[aria-pressed]').forEach(n=>n.setAttribute('aria-pressed',String(n===button)));document.getElementById('selection').textContent=title;document.getElementById('description').textContent=description;document.querySelector('.notice').textContent=''}</script></html>
